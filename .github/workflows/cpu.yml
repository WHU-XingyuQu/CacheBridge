name: CPU tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,fitting]'
      - run: python -m pytest
      - run: python examples/fit_and_map.py
      - run: python examples/sample_trajectory.py
      - run: python examples/inspect_architecture.py
      - run: python -m build
      - name: Installed wheel smoke
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          cd "${RUNNER_TEMP}"
          cachebridge recipes
          cachebridge fit --help
          cachebridge serve --help
          cachebridge backend --help

  architecture-caches:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]' transformers==5.15.0
      - run: python -m pytest tests/test_architectures.py tests/test_architecture_executors.py tests/test_architecture_caches.py

  backend-module:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: git submodule update --init third_party/sglang
      - name: Prepare and verify pinned engine without GPU dependencies
        env:
          PYTHONPATH: src
        run: |
          python -m cachebridge backend prepare
          python -m cachebridge backend verify .cache/cachebridge/sglang
          test -z "$(git -C third_party/sglang status --porcelain --untracked-files=no)"
